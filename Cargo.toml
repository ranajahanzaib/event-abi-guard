[package]
name = "eventabi-guard"
version = "0.1.0"
edition = "2024"
description = "Offline compatibility checks for smart contract event consumers"
license = "MIT"
repository = "https://github.com/ranajahanzaib/event-abi-guard"

[[bin]]
name = "eventabi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sha3 = "0.10"
thiserror = "2"
